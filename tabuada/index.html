<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada - Calculadora de Multiplicação</title>
    <link rel="stylesheet" href="src/style.css">
    <link rel="icon" type="image/x-icon" href="public/icon.webp">
</head>
<body>

    <div id="app">
        <fieldset id="titulo">
            <h1>Tabuada</h1>
        </fieldset>

        <fieldset id="tab">
            <section>
                <div>
                    <p>
                        <label for="txtn">Digite um número:</label>
                        <input type="number" id="txtn" name="num" min="1" placeholder="Ex: 5">
                    </p>
                    <input type="button" value="Gerar Tabuada" id="txtb" onclick="tabuada()">
                </div>

                <div id="digitenum"></div>

                
            </section>
        </fieldset>
    </div>

        <p style="text-align: center; color: #d9e3e4; font-size: 0.9em; margin-top: 30px;">
            &copy; 2025 | Vitória Berdtt
        </p>

    <script src="src/main.js"></script>
</body>
</html>
